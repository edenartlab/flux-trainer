# Builds the trainer image with Google Cloud Build and pushes it to Artifact
# Registry. The image is about 50 GB (it contains the FLUX weights), so it
# cannot be built in Cloud Shell.
#
#   gcloud builds submit --no-source --config=cloudbuild.yaml \
#     --substitutions=_COMMIT=<full commit SHA of this repository>
#
# The build fetches exactly that commit, so nothing has to be uploaded and the
# image content is tied to a reviewed revision. No secrets are involved: every
# model the image downloads is public.
steps:
  - id: fetch
    name: gcr.io/cloud-builders/git
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        git init -q src
        cd src
        git fetch -q --depth=1 https://github.com/edenartlab/flux-trainer.git "${_COMMIT}"
        git checkout -q FETCH_HEAD
        test "$$(git rev-parse HEAD)" = "${_COMMIT}"

  - id: build
    name: gcr.io/cloud-builders/docker
    dir: src
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --label=org.opencontainers.image.revision=${_COMMIT}
      - -t
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

substitutions:
  _COMMIT: ""
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/trainers/flux-trainer:v2

timeout: 14400s

options:
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
  diskSizeGb: 300
  logging: CLOUD_LOGGING_ONLY
