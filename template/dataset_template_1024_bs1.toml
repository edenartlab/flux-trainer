[general]
flip_aug = true
color_aug = false
shuffle_caption = false
caption_tag_dropout_rate = 0.0
caption_extension = ".txt"

[[datasets]]
batch_size = 1
enable_bucket = true
resolution = 1024
min_bucket_reso = 512
max_bucket_reso = 2048
bucket_reso_steps = 64

  [[datasets.subsets]]
  image_dir = "path_to_your_dataset_folder"
  num_repeats = 1